<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillwater — About &amp; Contact</title>
<meta name="description" content="Stillwater Wellness Studio — physiotherapy, massage, yoga, counselling and nutrition under one roof.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F1}
html{scroll-behavior:smooth}
a{color:#1D4A3E}a:hover{color:#13221D}
.sw{--bg:#F4F6F1;--ink:#13221D;--muted:#4A5A54;--green:#1D4A3E;--green2:#2C6B58;--lime:#D4EE6F;--sand:#E7EDE2;--line:#D3DBD0;--ease:cubic-bezier(.16,1,.3,1);font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip}
.sw *{box-sizing:border-box}
.h{font-family:'Bricolage Grotesque',Manrope,sans-serif;letter-spacing:-0.02em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font:600 15px/1 Manrope,sans-serif;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;transition:transform .4s var(--ease),background .3s,color .3s,box-shadow .4s}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--green);color:#fff}.btn-dark:hover{color:#fff;background:#163a31;box-shadow:0 14px 30px -12px rgba(29,74,62,.6)}
.btn-lime{background:var(--lime);color:var(--ink)}.btn-lime:hover{color:var(--ink)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}
.btn:hover::after{transform:translateX(120%)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn .arr{transition:transform .35s}.btn:hover .arr{transform:translateX(4px)}
.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none}
.prog i{display:block;height:100%;background:var(--green2);transform-origin:left;transform:scaleX(0)}
.nav{position:sticky;top:0;z-index:50;background:rgba(244,246,241,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .4s,box-shadow .4s}
.nav.scrolled{border-color:rgba(211,219,208,.9);box-shadow:0 10px 30px -24px rgba(19,34,29,.4)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:80px;transition:height .4s var(--ease)}
.nav.scrolled .nav-in{height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 21px/1 'Bricolage Grotesque',sans-serif}
.logo:hover{color:var(--ink)}
.logo svg{transition:transform .8s var(--ease)}.logo:hover svg{transform:rotate(180deg)}
.links{display:flex;gap:32px}
.links a{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;position:relative;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);transform:scaleX(0);transform-origin:right;transition:transform .4s}
.links a:hover::after,.links a.on::after{transform:scaleX(1);transform-origin:left}
.links a.on{font-weight:700}
.burger{display:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center;color:var(--ink)}
.mnav{display:none}
@media (max-width:900px){.links,.nav-cta{display:none}.burger{display:inline-flex}.mnav{display:flex;flex-direction:column;padding:8px 24px 24px;animation:drop .4s var(--ease)}.mnav a{padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:17px}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.sec{padding:130px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green2);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:2px;background:currentColor}
.h2{font-size:clamp(36px,4.6vw,62px);line-height:1.02;margin:0;font-weight:700;max-width:760px}
.sub{color:var(--muted);font-size:18px;line-height:1.65;margin:0}
.dark{background:var(--ink);color:#fff;border-radius:40px;margin:0 12px}
.dark .kicker{color:var(--lime)}
.media{position:relative;overflow:hidden;border-radius:28px;background:#DCE4D7}
.px{position:absolute;inset:0;transform:scale(1.15);will-change:transform}
.px img,.media>img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#DCE4D7 0 18px,#D3DDCE 18px 36px)}
.ph span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.85);font-size:13px;font-weight:700;color:var(--green)}
.ready .rv{opacity:0;transform:translateY(70px);transition:opacity 1.2s var(--ease),transform 1.5s var(--ease),clip-path 1.6s var(--ease);transition-delay:var(--d,0s)}
.ready .rv.rv-l{transform:translateX(-80px)}
.ready .rv.rv-r{transform:translateX(80px)}
.ready .media.rv{transform:none;clip-path:inset(30% 0 0 0 round 28px)}
.ready .media.rv .px img,.ready .media.rv .px .ph{transform:scale(1.25);transition:transform 2s var(--ease)}
.ready .rv.in{opacity:1;transform:none}
.ready .media.rv.in{clip-path:inset(0 0 0 0 round 28px)}
.ready .media.rv.in .px img,.ready .media.rv.in .px .ph{transform:none}
.lines .ln{display:block;overflow:hidden;padding-bottom:.06em}
.lines .ln>span{display:inline-block;animation:rise 1.1s var(--ease) both}
.lines .ln:nth-child(2)>span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.fade{animation:fadeup 1s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.foot{padding:90px 0 40px}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:32px}
.foot h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 16px;color:var(--green2)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.foot li,.foot li a{color:var(--muted);text-decoration:none;font-size:15px}
.foot li a:hover{color:var(--ink)}
.foot-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.giant{font:700 clamp(64px,15vw,220px)/.85 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;color:var(--green);margin-top:56px;white-space:nowrap;overflow:hidden}
/* about */
.phead{padding:72px 0 40px}
.phead h1{font-size:clamp(48px,7vw,104px);line-height:.95;margin:18px 0 0;font-weight:700}
.collage{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:56px}
.collage .media:first-child{height:540px}
.collage .stack{display:grid;gap:18px}
.collage .stack .media{height:261px}
.split{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:72px;align-items:start}
.story p{font-size:19px;line-height:1.7;color:var(--muted);margin:0 0 22px}
.story p:first-child{font:600 clamp(24px,2.4vw,32px)/1.35 'Bricolage Grotesque',sans-serif;color:var(--ink);letter-spacing:-.01em}
.values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.value{padding:30px 26px;border-radius:26px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.value b{display:block;font:700 46px/1 'Bricolage Grotesque',sans-serif;color:var(--lime);margin-bottom:26px}
.value h3{margin:0 0 8px;font-size:21px}.value p{margin:0;color:#C3CEC9;line-height:1.6;font-size:15px}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.space .media{height:420px}
.space h3{margin:18px 0 6px;font-size:22px}.space p{margin:0;color:var(--muted);line-height:1.6}
.access{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:32px}
.acc{display:flex;gap:14px;align-items:flex-start;padding:20px;border-radius:20px;background:#fff;border:1px solid var(--line);line-height:1.55}
.acc svg{flex:none;color:var(--green2)}
.qa{border-bottom:1px solid var(--line)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;background:none;border:0;font:700 19px/1.35 Manrope,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.qa .pm{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .4s var(--ease)}
.qa.open .pm{transform:rotate(45deg);background:var(--lime);border-color:var(--lime)}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.qa.open .ans{grid-template-rows:1fr}
.ans>div{overflow:hidden}
.ans p{margin:0 0 24px;color:var(--muted);line-height:1.65;font-size:16px;max-width:640px}
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.panel{background:#fff;border:1px solid var(--line);border-radius:30px;padding:36px}
.info{display:flex;flex-direction:column;gap:18px}
.irow{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.irow .ic{width:48px;height:48px;border-radius:14px;background:var(--sand);display:grid;place-items:center;color:var(--green);flex:none}
.irow small{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.irow b{font-weight:600}
.map{height:240px;border-radius:22px;background:#DCE4D7;position:relative;overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(29,74,62,.5);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(29,74,62,.5)}100%{box-shadow:0 0 0 28px rgba(29,74,62,0)}}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}
.field input,.field textarea,.field select{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:500 16px Manrope,sans-serif;color:var(--ink);transition:border-color .3s,box-shadow .3s}
.field textarea{min-height:140px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(44,107,88,.15);background:#fff}
.sent{text-align:center;padding:40px 10px;animation:pop .6s var(--ease) both}
.check{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
@media (max-width:900px){.split,.contact,.spaces,.collage{grid-template-columns:minmax(0,1fr)}.values{grid-template-columns:repeat(2,minmax(0,1fr))}.sec{padding:90px 0}.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.collage .media:first-child{height:360px}.space .media{height:320px}}
@media (max-width:600px){.values,.access,.foot-grid{grid-template-columns:minmax(0,1fr)}.dark{margin:0;border-radius:28px}.panel{padding:24px}}
@media (prefers-reduced-motion:reduce){.sw *,.sw *::before,.sw *::after{animation:none!important;transition:none!important}.ready .rv{opacity:1!important;transform:none!important;clip-path:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="sw {{ rootCls }}">
<div class="prog" aria-hidden="true"><i data-prog="1"></i></div>
<header class="nav {{ navCls }}">
<div class="wrap nav-in">
<a class="logo" href="index.html" aria-label="Stillwater home"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1D4A3E"></circle><path d="M8 19c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round"></path><path d="M8 13c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"></path></svg>Stillwater</a>
<nav class="links" aria-label="Main">
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="team.html">Practitioners</a>
<a href="about.html" class="on" aria-current="page">About</a>
</nav>
<a class="btn btn-dark nav-cta" href="book.html">Book a visit <span class="arr">→</span></a>
<button class="burger" aria-label="Menu" aria-expanded="{{ menuAria }}" onClick="{{ toggleMenu }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav class="mnav" aria-label="Mobile">
<a href="index.html">Home</a><a href="services.html">Services</a><a href="team.html">Practitioners</a><a href="about.html">About</a><a href="book.html">Book a visit</a>
</nav>
</sc-if>
</header>

<section class="phead">
<div class="wrap">
<p class="kicker fade">About Stillwater</p>
<h1 class="h lines"><span class="ln"><span>Care that</span></span><span class="ln"><span>fits together.</span></span></h1>
<div class="collage">
<div class="media fade" style="animation-delay: .2s"><div class="px" data-px=".1"><img src="https://images.unsplash.com/photo-1451976426598-a7593bd6d0b2?auto=format&fit=crop&w=1400&q=75" alt="Studio exterior with plants" loading="lazy"></div></div>
<div class="stack">
<div class="media fade" style="animation-delay: .3s"><div class="px" data-px=".16"><img src="https://images.unsplash.com/photo-1739298061709-cfc57e6b620e?auto=format&fit=crop&w=1400&q=75" alt="Team in conversation" loading="lazy"></div></div>
<div class="media fade" style="animation-delay: .4s"><div class="px" data-px=".16"><img src="https://images.unsplash.com/photo-1512917602760-97a8fb80dca5?auto=format&fit=crop&w=1400&q=75" alt="Hands holding tea" loading="lazy"></div></div>
</div>
</div>
</div>
</section>

<section class="sec">
<div class="wrap split">
<div><p class="kicker rv">Our story</p><h2 class="h h2 rv" style="--d: .1s">Started by a physio who was tired of fragmented care.</h2></div>
<div class="story">
<p class="rv">Too many people see a physio, a therapist and a nutritionist who never speak to each other — and end up with advice that pulls in different directions.</p>
<p class="rv" style="--d: .1s">Stillwater brings those specialists under one roof, with one intake and one shared plan. Your practitioners meet every week, so each session builds on the last.</p>
<p class="rv" style="--d: .2s">We also built the studio to feel calm: natural light, quiet rooms, no rushed waiting area — because recovery starts the moment you walk in.</p>
</div>
</div>
</section>

<section class="sec dark">
<div class="wrap">
<div class="sec-head"><div class="rv"><p class="kicker">What we believe</p><h2 class="h h2">Four promises we hold ourselves to.</h2></div></div>
<div class="values">
<div class="value rv"><b>01</b><h3 class="h">Listen first</h3><p>Longer first visits so we understand your story before we treat.</p></div>
<div class="value rv" style="--d: .1s"><b>02</b><h3 class="h">Evidence-led</h3><p>Methods backed by research, explained in plain language.</p></div>
<div class="value rv" style="--d: .2s"><b>03</b><h3 class="h">Joined-up</h3><p>One shared plan across every practitioner you see.</p></div>
<div class="value rv" style="--d: .3s"><b>04</b><h3 class="h">Welcoming</h3><p>Every body, age and background, with care in your language where we can.</p></div>
</div>
</div>
</section>

<section class="sec">
<div class="wrap">
<div class="sec-head"><div class="rv"><p class="kicker">The space</p><h2 class="h h2">Designed to help you slow down.</h2></div></div>
<div class="spaces">
<div class="space rv"><div class="media"><div class="px" data-px=".1"><img src="https://images.unsplash.com/photo-1787651343620-8d5303006ecb?auto=format&fit=crop&w=1400&q=75" alt="Treatment room" loading="lazy"></div></div><h3 class="h">Treatment rooms</h3><p>Six quiet, heated rooms with soft lighting for hands-on care.</p></div>
<div class="space rv" style="--d: .12s"><div class="media"><div class="px" data-px=".1"><img src="https://images.unsplash.com/photo-1687783615476-f4c12358ca9d?auto=format&fit=crop&w=1400&q=75" alt="Movement hall with mats" loading="lazy"></div></div><h3 class="h">Movement hall</h3><p>A bright, sprung-floor space for yoga and reformer Pilates.</p></div>
<div class="space rv" style="--d: .24s"><div class="media"><div class="px" data-px=".1"><img src="https://images.unsplash.com/photo-1787496994323-59ac5cff09f9?auto=format&fit=crop&w=1400&q=75" alt="Tea lounge" loading="lazy"></div></div><h3 class="h">Tea lounge</h3><p>Arrive early, have a herbal tea and settle in before your session.</p></div>
</div>
<div class="access">
<div class="acc rv"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4" r="2"></circle><path d="M12 7v6h5l2 6M12 13l-3 7M8 9h8"></path></svg><span><b>Step-free access</b> throughout, with an accessible treatment room on the ground floor.</span></div>
<div class="acc rv" style="--d: .1s"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14l-1.5-6h-11zM7 17v3M17 17v3M8 11l2-5h4l2 5"></path></svg><span><b>Parking and transit</b> — [ADD PARKING AND NEAREST STATION]</span></div>
</div>
</div>
</section>

<section class="sec" style="padding-top: 0">
<div class="wrap split">
<div><p class="kicker rv">FAQ</p><h2 class="h h2 rv" style="--d: .1s">Good questions, clear answers.</h2></div>
<div class="rv">
<sc-for list="{{ faqs }}" as="f" hint-placeholder-count="5">
<div class="qa {{ f.cls }}">
<button aria-expanded="{{ f.open }}" onClick="{{ f.toggle }}">{{ f.q }}<span class="pm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span></button>
<div class="ans"><div><p>{{ f.a }}</p></div></div>
</div>
</sc-for>
</div>
</div>
</section>

<section class="sec" id="contact" style="padding-top: 0">
<div class="wrap">
<div class="sec-head"><div class="rv"><p class="kicker">Contact</p><h2 class="h h2">Come and say hello.</h2></div></div>
<div class="contact">
<div class="panel info rv rv-l">
<div class="map" aria-label="Map placeholder" role="img"><svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M0 80 H400 M0 170 H400 M120 0 V240 M290 0 V240" stroke="#fff" stroke-width="10"></path><path d="M0 30 L400 210" stroke="#fff" stroke-width="5" opacity=".7"></path><rect x="140" y="95" width="60" height="55" rx="6" fill="#C9D6C3"></rect><rect x="215" y="20" width="60" height="45" rx="6" fill="#C9D6C3"></rect><circle cx="340" cy="120" r="30" fill="#BFD3B0"></circle></svg><span class="pin"></span></div>
<div class="irow"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span><span><small>Address</small><b>[STUDIO ADDRESS]</b></span></div>
<div class="irow"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span><small>Opening hours</small><b>[OPENING HOURS]</b></span></div>
<div class="irow"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></span><span><small>Phone</small><b>[PHONE]</b></span></div>
<div class="irow" style="border: 0"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span><span><small>Email</small><b>[EMAIL]</b></span></div>
</div>
<div class="panel rv rv-r">
<sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
<div>
<h3 class="h" style="font-size: 28px; margin: 0 0 8px">Send us a message</h3>
<p class="sub" style="font-size: 16px; margin-bottom: 24px">We reply within one working day.</p>
<div class="field"><label for="c-name">Name</label><input id="c-name" type="text" autocomplete="name" value="{{ cname }}" onChange="{{ onName }}"></div>
<div class="field"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email" value="{{ cemail }}" onChange="{{ onEmail }}"></div>
<div class="field"><label for="c-topic">Topic</label><select id="c-topic" value="{{ ctopic }}" onChange="{{ onTopic }}"><option>Help choosing a service</option><option>Booking question</option><option>Packages and membership</option><option>Something else</option></select></div>
<div class="field"><label for="c-msg">Message</label><textarea id="c-msg" value="{{ cmsg }}" onChange="{{ onMsg }}"></textarea></div>
<button class="btn btn-dark" style="width: 100%" disabled="{{ cantSend }}" onClick="{{ send }}">Send message <span class="arr">→</span></button>
</div>
</sc-if>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
<div class="sent"><div class="check"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#13221D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div><h3 class="h" style="font-size: 28px; margin: 0 0 10px">Thanks, {{ firstName }}.</h3><p class="sub" style="font-size: 16px">We will reply to {{ cemail }} within one working day.</p></div>
</sc-if>
</div>
</div>
</div>
</section>

<footer class="foot">
<div class="wrap">
<div class="foot-grid">
<div><a class="logo" href="index.html"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1D4A3E"></circle><path d="M8 19c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg>Stillwater</a><p style="color: #4A5A54; line-height: 1.6; max-width: 320px; margin: 16px 0 0">A healthcare and wellness studio for body and mind.</p></div>
<div><h4>Explore</h4><ul><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li><a href="team.html">Practitioners</a></li><li><a href="book.html">Book a visit</a></li></ul></div>
<div><h4>Services</h4><ul><li><a href="services.html">Physiotherapy</a></li><li><a href="services.html">Massage</a></li><li><a href="services.html">Yoga &amp; Pilates</a></li><li><a href="services.html">Counselling</a></li></ul></div>
<div><h4>Visit</h4><ul><li>[STUDIO ADDRESS]</li><li>[OPENING HOURS]</li><li>[PHONE]</li><li>[EMAIL]</li></ul></div>
</div>
<div class="giant" aria-hidden="true">stillwater</div>
<div class="foot-bot"><span>© 2026 Stillwater Wellness Studio · Photography via Unsplash</span><span>Not for emergencies — call your local emergency number.</span></div>
</div>
</footer>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5200}}'>
class Component extends DCLogic {

      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); self._io.unobserve(e.target); } });

      self._raf = requestAnimationFrame(function () { self._raf = 0; self.fx(); });
    };
    document.addEventListener('scroll', this._onScroll, { passive: true, capture: true });
    window.addEventListener('resize', this._onScroll);
    this.setState({ ready: true });
  }
  componentDidUpdate() { this.scan(); this.fx(); }
  componentWillUnmount() {
    document.removeEventListener('scroll', this._onScroll, { capture: true });
    window.removeEventListener('resize', this._onScroll);
    if (this._io) this._io.disconnect();
  }
  scan() {
    var els = document.querySelectorAll('.rv:not(.in):not([data-o])');
    var root = document.scrollingElement || document.documentElement;
    var noScroll = root.scrollHeight <= window.innerHeight + 40;
    for (var i = 0; i < els.length; i++) {
      if (this._io && !noScroll) { els[i].setAttribute('data-o', '1'); this._io.observe(els[i]); }

  }
  fx() {
    var vh = window.innerHeight || 800;
    var root = document.scrollingElement || document.documentElement;
    var y = root.scrollTop || window.pageYOffset || 0;

      var el = pxs[i], r = el.parentNode.getBoundingClientRect();

  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var FAQS = [
      { q: 'I am not sure which service I need. Where do I start?', a: 'Book a free 15-minute discovery call. We will listen to what is going on and suggest the right practitioner.' },
      { q: 'Do I need a doctor’s referral?', a: 'No referral is needed for most services. If you are recovering from surgery or a serious injury, bring any notes from your doctor.' },
      { q: 'What should I bring to my first visit?', a: 'Comfortable clothing, a water bottle and any relevant medical information. Arrive ten minutes early to settle in.' },
      { q: 'Can I reschedule or cancel?', a: 'Yes — free of charge up to 24 hours before your session.' },
      { q: 'Are online sessions as effective?', a: 'For counselling, nutrition and meditation, online sessions work very well. Hands-on treatments are in studio or at home.' }
    ];
    var fo = s.faq == null ? 0 : s.faq;
    var cname = s.cname || '', cemail = s.cemail || '', cmsg = s.cmsg || '';
    var ok = cname.trim() && /.+@.+\..+/.test(cemail) && cmsg.trim();
    return {
      rootCls: s.ready ? 'ready' : '',

      cname: cname, cemail: cemail, cmsg: cmsg, ctopic: s.ctopic || 'Help choosing a service',
      onName: function (e) { self.setState({ cname: e.target.value }); },
      onEmail: function (e) { self.setState({ cemail: e.target.value }); },
      onMsg: function (e) { self.setState({ cmsg: e.target.value }); },
      onTopic: function (e) { self.setState({ ctopic: e.target.value }); },
      cantSend: !ok,
      send: function () { if (ok) self.setState({ sent: true }); },
      sent: !!s.sent, notSent: !s.sent,
      firstName: cname.trim().split(' ')[0]
    };
  }
}
</script>
