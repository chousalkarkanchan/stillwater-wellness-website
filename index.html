<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillwater — Home</title>
<meta name="description" content="Stillwater Wellness Studio — physiotherapy, massage, yoga, counselling and nutrition under one roof.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F1}
html{scroll-behavior:smooth}
a{color:#1D4A3E}a:hover{color:#13221D}
.sw{--bg:#F4F6F1;--ink:#13221D;--muted:#4A5A54;--green:#1D4A3E;--green2:#2C6B58;--lime:#D4EE6F;--sand:#E7EDE2;--line:#D3DBD0;--ease:cubic-bezier(.16,1,.3,1);font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip}
.sw *{box-sizing:border-box}
.h{font-family:'Bricolage Grotesque',Manrope,sans-serif;letter-spacing:-0.02em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font:600 15px/1 Manrope,sans-serif;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;transition:transform .4s var(--ease),background .3s,color .3s,box-shadow .4s}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--green);color:#fff}.btn-dark:hover{color:#fff;background:#163a31;box-shadow:0 14px 30px -12px rgba(29,74,62,.6)}
.btn-lime{background:var(--lime);color:var(--ink)}.btn-lime:hover{color:var(--ink);box-shadow:0 14px 30px -12px rgba(160,190,60,.7)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn-ghost:hover{background:var(--ink);color:#fff}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}
.btn:hover::after{transform:translateX(120%)}
.btn .arr{transition:transform .35s}.btn:hover .arr{transform:translateX(4px)}
.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none}
.prog i{display:block;height:100%;background:var(--green2);transform-origin:left;transform:scaleX(0)}
.nav{position:sticky;top:0;z-index:50;background:rgba(244,246,241,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .4s,box-shadow .4s}
.nav.scrolled{border-color:rgba(211,219,208,.9);box-shadow:0 10px 30px -24px rgba(19,34,29,.4)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:80px;transition:height .4s var(--ease)}
.nav.scrolled .nav-in{height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 21px/1 'Bricolage Grotesque',sans-serif}
.logo:hover{color:var(--ink)}
.logo svg{transition:transform .8s var(--ease)}.logo:hover svg{transform:rotate(180deg)}
.links{display:flex;gap:32px}
.links a{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;position:relative;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);transform:scaleX(0);transform-origin:right;transition:transform .4s}
.links a:hover::after,.links a.on::after{transform:scaleX(1);transform-origin:left}
.links a.on{font-weight:700}
.burger{display:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center;color:var(--ink)}
.mnav{display:none}
@media (max-width:900px){.links,.nav-cta{display:none}.burger{display:inline-flex}.mnav{display:flex;flex-direction:column;padding:8px 24px 24px;animation:drop .4s var(--ease)}.mnav a{padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:17px}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.sec{padding:130px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green2);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:2px;background:currentColor}
.h2{font-size:clamp(36px,4.6vw,62px);line-height:1.02;margin:0;font-weight:700;max-width:760px}
.sub{color:var(--muted);font-size:18px;line-height:1.65;margin:0}
.dark{background:var(--ink);color:#fff;border-radius:40px;margin:0 12px}
.dark .kicker{color:var(--lime)}
.media{position:relative;overflow:hidden;border-radius:28px;background:#DCE4D7}
.px{position:absolute;inset:0;transform:scale(1.15);will-change:transform}
.px img,.media>img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#DCE4D7 0 18px,#D3DDCE 18px 36px)}
.ph span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.85);font-size:13px;font-weight:700;color:var(--green)}
.ph.dk{background:repeating-linear-gradient(135deg,#2C5A4D 0 18px,#285246 18px 36px)}
.ready .rv{opacity:0;transform:translateY(70px);transition:opacity 1.2s var(--ease),transform 1.5s var(--ease),clip-path 1.6s var(--ease);transition-delay:var(--d,0s)}
.ready .rv.rv-l{transform:translateX(-80px)}
.ready .rv.rv-r{transform:translateX(80px)}
.ready .rv.rv-s{transform:scale(.9)}
.ready .media.rv{transform:none;clip-path:inset(30% 0 0 0 round 28px)}
.ready .media.rv .px img,.ready .media.rv .px .ph{transform:scale(1.25);transition:transform 2s var(--ease)}
.ready .rv.in{opacity:1;transform:none}
.ready .media.rv.in{clip-path:inset(0 0 0 0 round 28px)}
.ready .media.rv.in .px img,.ready .media.rv.in .px .ph{transform:none}
.lines .ln{display:block;overflow:hidden;padding-bottom:.06em}
.lines .ln>span{display:inline-block;animation:rise 1.1s var(--ease) both}
.lines .ln:nth-child(2)>span{animation-delay:.12s}.lines .ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.fade{animation:fadeup 1s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.cta{background:var(--lime);border-radius:40px;padding:80px 48px;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:clamp(38px,5.4vw,72px);line-height:1;margin:0 auto 20px;max-width:880px;position:relative}
.cta p{font-size:18px;margin:0 auto 32px;max-width:520px;line-height:1.6;color:#2A3A34;position:relative}
.cta .c1,.cta .c2{position:absolute;border-radius:50%;border:2px solid rgba(19,34,29,.15)}
.cta .c1{width:340px;height:340px;left:-120px;top:-140px;animation:floaty 9s ease-in-out infinite}
.cta .c2{width:240px;height:240px;right:-60px;bottom:-110px;animation:floaty 7s ease-in-out infinite reverse}
.foot{padding:90px 0 40px}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:32px}
.foot h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 16px;color:var(--green2)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.foot li,.foot li a{color:var(--muted);text-decoration:none;font-size:15px}
.foot li a:hover{color:var(--ink)}
.foot-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.giant{font:700 clamp(64px,15vw,220px)/.85 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;color:var(--green);margin-top:56px;white-space:nowrap;overflow:hidden}
/* home */
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--green)}
.eyebrow .dot{width:24px;height:24px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.eyebrow .dot i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.4}}
.hero h1{font-size:clamp(44px,6.2vw,86px);line-height:.98;margin:24px 0;font-weight:700}
.hero h1 em{font-style:normal;color:var(--green2)}
.lead{font-size:19px;line-height:1.6;color:var(--muted);max-width:520px;margin:0 0 32px}
.finder{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 30px 60px -40px rgba(19,34,29,.35)}
.finder-q{font-weight:700;font-size:15px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font:600 14px Manrope,sans-serif;color:var(--ink);cursor:pointer;transition:all .3s var(--ease)}
.chip:hover{border-color:var(--green);transform:translateY(-2px)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.rec{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rec-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:18px;background:var(--sand);animation:pop .55s var(--ease) both;text-decoration:none;color:var(--ink);transition:background .3s}
.rec-item:hover{background:var(--lime);color:var(--ink)}
.rec-item b{display:block;font-size:15px}.rec-item small{color:var(--muted);font-size:13px}
.hero-art{position:relative;height:640px}
.hero-art .m1{position:absolute;left:0;top:0;width:78%;height:88%;border-radius:999px 999px 32px 32px}
.hero-art .m2{position:absolute;right:0;bottom:0;width:44%;height:42%;border-radius:32px;border:8px solid var(--bg)}
.breath{position:absolute;left:4%;bottom:4%;background:#fff;border-radius:22px;padding:14px 18px 14px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 24px 40px -24px rgba(19,34,29,.45);animation:floaty 6s ease-in-out infinite;z-index:2}
.breath .orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E9F7B5,#B6D85A 55%,#7FA83A);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}
.breath b{display:block;font-size:15px}.breath small{font-size:13px;color:var(--muted)}
.ring-txt{position:absolute;right:4%;top:2%;width:124px;height:124px;animation:spin 18s linear infinite;color:var(--ink);z-index:2}
.mq{background:var(--green);color:#fff;overflow:hidden;padding:22px 0;margin-top:72px;transform:rotate(-1.2deg) scale(1.02)}
.mq-track{display:flex;width:max-content;animation:mq 36s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
.mq-item{display:flex;align-items:center;gap:28px;padding-right:28px;font:600 clamp(22px,3vw,34px)/1 'Bricolage Grotesque',sans-serif;white-space:nowrap}
.mq-item svg{color:var(--lime);flex:none}
@keyframes mq{to{transform:translateX(-50%)}}
.statement{font:600 clamp(30px,3.8vw,52px)/1.18 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin:0;max-width:1100px}
.statement span{color:var(--green2)}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fcard{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink)}
.fcard:hover{color:var(--ink)}
.fcard .media{height:340px;transition:border-radius .6s var(--ease)}
.fcard:hover .media{border-radius:120px 120px 28px 28px}
.fcard .px{transition:transform 1s var(--ease)}
.fcard h3{margin:4px 0 0;font-size:23px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard h3 svg{transition:transform .4s var(--ease)}.fcard:hover h3 svg{transform:translateX(6px) rotate(-45deg)}
.fcard p{margin:0;color:var(--muted);line-height:1.55;font-size:15px}
.tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green2)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px;align-items:center}
.pillars{display:flex;flex-direction:column;margin-top:36px}
.pillar{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;padding:22px 0;border-top:1px solid var(--line)}
.pillar .n{font:700 15px 'Bricolage Grotesque',sans-serif;width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.pillar h3{margin:0 0 6px;font-size:21px}.pillar p{margin:0;color:var(--muted);line-height:1.6}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.step{padding:32px;border-radius:28px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:background .4s}
.step:hover{background:rgba(255,255,255,.09)}
.step-n{font:700 64px/1 'Bricolage Grotesque',sans-serif;color:transparent;-webkit-text-stroke:1.5px var(--lime);margin-bottom:40px;display:block}
.step h3{margin:0 0 10px;font-size:24px}
.step p{margin:0;color:#C3CEC9;line-height:1.6;font-size:16px}
.tprev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tcard .media{height:420px}
.tcard h3{margin:18px 0 4px;font-size:22px}.tcard p{margin:0;color:var(--green2);font-weight:600;font-size:14px}
.gal{display:grid;grid-template-columns:1.2fr .8fr 1fr .9fr;gap:16px;align-items:end}
.gal .media:nth-child(1){height:460px}.gal .media:nth-child(2){height:340px}.gal .media:nth-child(3){height:520px}.gal .media:nth-child(4){height:380px}
@media (max-width:1100px){.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.hero-grid,.split,.steps,.tprev{grid-template-columns:minmax(0,1fr)}.hero-art{height:480px}.sec{padding:90px 0}.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gal{grid-template-columns:repeat(2,minmax(0,1fr))}.gal .media{height:260px!important}}
@media (max-width:600px){.feat,.rec,.foot-grid{grid-template-columns:minmax(0,1fr)}.dark{margin:0;border-radius:28px}.cta{padding:56px 24px}.hero-art{height:400px}}
@media (prefers-reduced-motion:reduce){.sw *,.sw *::before,.sw *::after{animation:none!important;transition:none!important}.ready .rv{opacity:1!important;transform:none!important;clip-path:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="sw {{ rootCls }}">
<div class="prog" aria-hidden="true"><i data-prog="1"></i></div>
<header class="nav {{ navCls }}">
<div class="wrap nav-in">
<a class="logo" href="index.html" aria-label="Stillwater home"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1D4A3E"></circle><path d="M8 19c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round"></path><path d="M8 13c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"></path></svg>Stillwater</a>
<nav class="links" aria-label="Main">
<a href="index.html" class="on" aria-current="page">Home</a>
<a href="services.html">Services</a>
<a href="team.html">Practitioners</a>
<a href="about.html">About</a>
</nav>
<a class="btn btn-dark nav-cta" href="book.html">Book a visit <span class="arr">→</span></a>
<button class="burger" aria-label="Menu" aria-expanded="{{ menuAria }}" onClick="{{ toggleMenu }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav class="mnav" aria-label="Mobile">
<a href="index.html">Home</a><a href="services.html">Services</a><a href="team.html">Practitioners</a><a href="about.html">About</a><a href="book.html">Book a visit</a>
</nav>
</sc-if>
</header>

<section class="hero">
<div class="wrap hero-grid">
<div>
<span class="eyebrow fade"><span class="dot"><i></i></span>Healthcare &amp; wellness studio</span>
<h1 class="h lines"><span class="ln"><span>Find the right care.</span></span><span class="ln"><span><em>Feel like yourself</em></span></span><span class="ln"><span>again.</span></span></h1>
<p class="lead fade" style="animation-delay: .35s">Physiotherapy, massage, yoga, counselling and nutrition under one roof — with practitioners who talk to each other, so your care fits together.</p>
<div class="finder fade" style="animation-delay: .5s">
<p class="finder-q">What would you like help with?</p>
<div class="chips">
<sc-for list="{{ needs }}" as="n" hint-placeholder-count="6"><button class="chip {{ n.cls }}" onClick="{{ n.pick }}">{{ n.label }}</button></sc-for>
</div>
<div class="rec">
<sc-for list="{{ recs }}" as="r" hint-placeholder-count="2"><a class="rec-item" href="services.html"><span><b>{{ r.name }}</b><small>{{ r.dur }}</small></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-for>
</div>
</div>
</div>
<div class="hero-art fade" style="animation-delay: .15s">
<div class="media m1"><div class="px" data-px=".1"><img src="https://images.unsplash.com/photo-1566501206188-5dd0cf160a0e?auto=format&fit=crop&w=1400&q=75" alt="Woman in a calm yoga pose" loading="lazy"></div></div>
<div class="media m2"><div class="px" data-px=".2"><img src="https://images.unsplash.com/photo-1600334089648-b0d9d3028eb2?auto=format&fit=crop&w=1400&q=75" alt="Massage stones" loading="lazy"></div></div>
<svg class="ring-txt" viewBox="0 0 120 120" aria-hidden="true"><defs><path id="circ" d="M60 60 m-46 0 a46 46 0 1 1 92 0 a46 46 0 1 1 -92 0"></path></defs><circle cx="60" cy="60" r="58" fill="#F4F6F1"></circle><text font-family="Manrope" font-size="11.5" font-weight="700" letter-spacing="3.2" fill="currentColor"><textPath href="#circ">BREATHE · MOVE · HEAL · REST · </textPath></text><circle cx="60" cy="60" r="9" fill="#D4EE6F"></circle></svg>
<div class="breath"><span class="orb"></span><span><b>Same-week visits</b><small>In studio, online or at home</small></span></div>
</div>
</div>
<div class="mq" aria-hidden="true"><div class="mq-track">
<sc-for list="{{ marquee }}" as="m" hint-placeholder-count="16"><span class="mq-item">{{ m }}<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.6 6.6 5.4 11.4 12 12-6.6.6-11.4 5.4-12 12-.6-6.6-5.4-11.4-12-12C6.6 11.4 11.4 6.6 12 0z"></path></svg></span></sc-for>
</div></div>
</section>

<section class="sec">
<div class="wrap">
<p class="kicker rv">Our approach</p>
<p class="statement rv" style="--d: .1s">We treat the whole person, not just the symptom. <span>One intake, one shared plan,</span> and a team of specialists who work together on it.</p>
</div>
</section>

<section class="sec" style="padding-top: 0">
<div class="wrap">
<div class="sec-head"><div class="rv"><p class="kicker">Featured services</p><h2 class="h h2">Where most people begin.</h2></div><a class="btn btn-ghost rv" href="services.html" style="--d: .15s">All services <span class="arr">→</span></a></div>
<div class="feat">
