<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillwater — Book a visit</title>
<meta name="description" content="Stillwater Wellness Studio — physiotherapy, massage, yoga, counselling and nutrition under one roof.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F1}
a{color:#1D4A3E}a:hover{color:#13221D}
.sw{--bg:#F4F6F1;--ink:#13221D;--muted:#4A5A54;--green:#1D4A3E;--green2:#2C6B58;--lime:#D4EE6F;--sand:#E7EDE2;--line:#D3DBD0;--ease:cubic-bezier(.16,1,.3,1);font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip;min-height:100vh}
.sw *{box-sizing:border-box}
.h{font-family:'Bricolage Grotesque',Manrope,sans-serif;letter-spacing:-0.02em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font:600 15px/1 Manrope,sans-serif;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;transition:transform .4s var(--ease),background .3s,color .3s,box-shadow .4s}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--green);color:#fff}.btn-dark:hover{color:#fff;background:#163a31;box-shadow:0 14px 30px -12px rgba(29,74,62,.6)}
.btn-lime{background:var(--lime);color:var(--ink)}.btn-lime:hover{color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn-ghost:hover{border-color:var(--ink)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}
.btn:hover::after{transform:translateX(120%)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn .arr{transition:transform .35s}.btn:hover .arr{transform:translateX(4px)}
.nav{position:sticky;top:0;z-index:50;background:rgba(244,246,241,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 21px/1 'Bricolage Grotesque',sans-serif}
.logo:hover{color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;color:var(--ink);min-height:44px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green2);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:2px;background:currentColor}
.lines .ln{display:block;overflow:hidden;padding-bottom:.06em}
.lines .ln>span{display:inline-block;animation:rise 1.1s var(--ease) both}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.fade{animation:fadeup .9s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.top{padding:56px 0 32px}
.top h1{font-size:clamp(44px,6vw,84px);line-height:.96;margin:0;font-weight:700}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:40px 0 28px}
.sp{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:inherit;color:var(--muted)}
.sp:disabled{cursor:default}
.sp .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.sp .bar i{display:block;height:100%;background:var(--green);transform-origin:left;transform:scaleX(0);transition:transform .8s var(--ease)}
.sp.done .bar i,.sp.cur .bar i{transform:scaleX(1)}
.sp.cur .bar i{background:var(--lime)}
.sp span{font-size:14px;font-weight:700}
.sp.cur span,.sp.done span{color:var(--ink)}
.book{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:24px;align-items:start;padding-bottom:100px}
.panel{background:#fff;border:1px solid var(--line);border-radius:30px;padding:36px;animation:pop .6s var(--ease) both}
.panel h2{font-size:30px;margin:0 0 6px}
.panel .hint{color:var(--muted);margin:0 0 26px;line-height:1.55}
.svcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:72px;padding:14px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;transition:all .35s var(--ease);animation:pop .5s var(--ease) both}
.svc b{display:block;font-size:16px}.svc small{color:var(--muted);font-size:13px}
.svc:hover{border-color:var(--green);transform:translateY(-2px)}
.svc.on{background:var(--green);border-color:var(--green);color:#fff}
.svc.on small{color:#C9D6D1}
.svc .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:all .3s}
.svc.on .tick{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.pros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pro{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-family:inherit;color:var(--ink);transition:all .35s var(--ease);animation:pop .5s var(--ease) both}
.pro:hover{border-color:var(--green);transform:translateY(-3px)}
.pro.on{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px var(--lime)}
.pro .av{width:64px;height:64px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font:700 22px 'Bricolage Grotesque',sans-serif}
.pro b{font-size:15px}.pro small{color:var(--muted);font-size:13px;text-align:center}
.seg{display:inline-flex;padding:5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;margin-bottom:18px}
.seg button{min-height:40px;padding:0 18px;border-radius:999px;border:0;background:transparent;font:600 14px Manrope,sans-serif;cursor:pointer;color:var(--muted);transition:all .3s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -4px rgba(19,34,29,.25)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{min-height:80px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Manrope,sans-serif;color:var(--ink);transition:all .3s var(--ease)}
.day small{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font:700 22px 'Bricolage Grotesque',sans-serif}
.day:hover{border-color:var(--green);transform:translateY(-2px)}
.day.on{background:var(--lime);border-color:var(--lime)}
.day.on small{color:var(--ink)}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.time{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:600 15px Manrope,sans-serif;color:var(--ink);cursor:pointer;transition:all .3s var(--ease);animation:pop .4s var(--ease) both}
.time:hover:not(:disabled){border-color:var(--green)}
.time.on{background:var(--green);border-color:var(--green);color:#fff}
.time:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:13px;font-weight:700;margin:0 0 8px}
.field input,.field textarea{width:100%;min-height:52px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font:500 16px Manrope,sans-serif;color:var(--ink);transition:border-color .3s,box-shadow .3s}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(44,107,88,.15);background:#fff}
.full{grid-column:1/-1}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.sum{position:sticky;top:96px;background:var(--green);color:#fff;border-radius:30px;padding:30px;overflow:hidden}
.sum::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;border:30px solid rgba(212,238,111,.15);animation:spin 20s linear infinite}
.sum h3{margin:0 0 20px;font-size:24px}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px}
.sum-row span{color:#B9CBC4}.sum-row b{text-align:right}
.sum .note{font-size:13px;color:#B9CBC4;margin:18px 0 0;line-height:1.5}
.success{text-align:center;padding:72px 32px}
.check{width:104px;height:104px;margin:0 auto 26px;border-radius:50%;background:var(--lime);display:grid;place-items:center;animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
.check path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .4s ease forwards}
@media (max-width:1000px){.book{grid-template-columns:minmax(0,1fr)}.sum{position:relative;top:0}}
@media (max-width:700px){.svcs,.fields{grid-template-columns:minmax(0,1fr)}.pros{grid-template-columns:repeat(2,minmax(0,1fr))}.days{grid-template-columns:repeat(4,minmax(0,1fr))}.times{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{padding:22px}.stepper span{font-size:12px}}
@media (prefers-reduced-motion:reduce){.sw *,.sw *::before,.sw *::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="sw">
<header class="nav">
<div class="wrap nav-in">
<a class="logo" href="index.html" aria-label="Stillwater home"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1D4A3E"></circle><path d="M8 19c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round"></path><path d="M8 13c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"></path></svg>Stillwater</a>
<a class="back" href="index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to site</a>
</div>
</header>

<div class="wrap">
<div class="top">
<p class="kicker fade">Book a visit</p>
<h1 class="h lines"><span class="ln"><span>Reserve your session.</span></span></h1>
</div>

<sc-if value="{{ notBooked }}" hint-placeholder-val="{{ true }}">
<div>
<div class="stepper">
<sc-for list="{{ steps }}" as="st" hint-placeholder-count="4">
<button class="sp {{ st.cls }}" disabled="{{ st.locked }}" onClick="{{ st.go }}"><span class="bar"><i></i></span><span>{{ st.label }}</span></button>
</sc-for>
</div>
<div class="book">
<div>
<sc-if value="{{ s1 }}" hint-placeholder-val="{{ true }}">
<div class="panel">
<h2 class="h">Which service would you like?</h2>
<p class="hint">Not sure? Choose the free discovery call and we will guide you.</p>
<div class="svcs">
<sc-for list="{{ svcs }}" as="o" hint-placeholder-count="9">
<button class="svc {{ o.cls }}" onClick="{{ o.pick }}" style="animation-delay: {{ o.delay }}"><span><b>{{ o.name }}</b><small>{{ o.dur }}</small></span><span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></button>
</sc-for>
</div>
<div class="navrow"><span></span><button class="btn btn-dark" disabled="{{ no1 }}" onClick="{{ next }}">Continue <span class="arr">→</span></button></div>
</div>
</sc-if>
<sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
<div class="panel">
<h2 class="h">Who would you like to see?</h2>
<p class="hint">Choose a practitioner, or let us pick whoever is free first.</p>
<div class="pros">
<sc-for list="{{ pros }}" as="p" hint-placeholder-count="3">
<button class="pro {{ p.cls }}" onClick="{{ p.pick }}" style="animation-delay: {{ p.delay }}"><span class="av" style="background: {{ p.tone }}">{{ p.ini }}</span><b>{{ p.name }}</b><small>{{ p.role }}</small></button>
</sc-for>
</div>
<div class="navrow"><button class="btn btn-ghost" onClick="{{ prev }}">Back</button><button class="btn btn-dark" disabled="{{ no2 }}" onClick="{{ next }}">Continue <span class="arr">→</span></button></div>
</div>
</sc-if>
<sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
<div class="panel">
<h2 class="h">Pick a day and time</h2>
<p class="hint">Showing the next seven days. Crossed-out times are already taken.</p>
<div class="seg" role="group" aria-label="Visit format">
<button class="{{ studioCls }}" onClick="{{ setStudio }}">In studio</button>
<button class="{{ onlineCls }}" onClick="{{ setOnline }}">Online</button>
<button class="{{ homeCls }}" onClick="{{ setHome }}">Home visit</button>
</div>
<div class="days">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<button class="day {{ d.cls }}" onClick="{{ d.pick }}"><small>{{ d.wd }}</small><b>{{ d.dd }}</b><small>{{ d.mo }}</small></button>
</sc-for>
</div>
<sc-if value="{{ hasDay }}" hint-placeholder-val="{{ true }}">
<div class="times">
<sc-for list="{{ times }}" as="t" hint-placeholder-count="8">
<button class="time {{ t.cls }}" disabled="{{ t.off }}" onClick="{{ t.pick }}" style="animation-delay: {{ t.delay }}">{{ t.t }}</button>
</sc-for>
</div>
</sc-if>
<div class="navrow"><button class="btn btn-ghost" onClick="{{ prev }}">Back</button><button class="btn btn-dark" disabled="{{ no3 }}" onClick="{{ next }}">Continue <span class="arr">→</span></button></div>
</div>
</sc-if>
<sc-if value="{{ s4 }}" hint-placeholder-val="{{ false }}">
<div class="panel">
<h2 class="h">Your details</h2>
<p class="hint">We send your confirmation and a short intake form here.</p>
<div class="fields">
<div class="field"><label for="b-name">Full name</label><input id="b-name" type="text" autocomplete="name" value="{{ name }}" onChange="{{ onName }}"></div>
<div class="field"><label for="b-phone">Phone</label><input id="b-phone" type="tel" autocomplete="tel" value="{{ phone }}" onChange="{{ onPhone }}"></div>
<div class="field full"><label for="b-email">Email</label><input id="b-email" type="email" autocomplete="email" value="{{ email }}" onChange="{{ onEmail }}"></div>
<div class="field full"><label for="b-note">Anything we should know? (optional)</label><textarea id="b-note" value="{{ note }}" onChange="{{ onNote }}"></textarea></div>
</div>
<div class="navrow"><button class="btn btn-ghost" onClick="{{ prev }}">Back</button><button class="btn btn-lime" disabled="{{ no4 }}" onClick="{{ confirm }}">Confirm booking <span class="arr">→</span></button></div>
</div>
</sc-if>
</div>
<aside class="sum">
<h3 class="h">Your visit</h3>
<div class="sum-row"><span>Service</span><b>{{ sumSvc }}</b></div>
<div class="sum-row"><span>Practitioner</span><b>{{ sumPro }}</b></div>
<div class="sum-row"><span>Format</span><b>{{ sumMode }}</b></div>
<div class="sum-row"><span>Date</span><b>{{ sumDate }}</b></div>
<div class="sum-row"><span>Time</span><b>{{ sumTime }}</b></div>
<div class="sum-row"><span>Price</span><b>{{ sumPrice }}</b></div>
<p class="note">Free cancellation up to 24 hours before your session.</p>
</aside>
</div>
</div>
</sc-if>

<sc-if value="{{ booked }}" hint-placeholder-val="{{ false }}">
<div class="panel success" style="margin-bottom: 100px">
<div class="check"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#13221D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
<h2 class="h" style="font-size: 40px; margin: 0 0 12px">You are booked, {{ firstName }}.</h2>
<p style="color: #4A5A54; font-size: 18px; line-height: 1.6; margin: 0 auto 30px; max-width: 560px">{{ sumSvc }} with {{ sumPro }} · {{ sumMode }} · {{ sumDate }} at {{ sumTime }}. Your confirmation and intake form are on their way to {{ email }}.</p>
<div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap"><button class="btn btn-dark" onClick="{{ reset }}">Book another visit</button><a class="btn btn-ghost" href="index.html">Back to home</a></div>
</div>
</sc-if>
</div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2800}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var SV = [
      { id: 'call', name: 'Free discovery call', dur: '15 min · phone or video', cat: 'any', price: 'Free' },
      { id: 'physio', name: 'Physiotherapy', dur: '45 min', cat: 'physio', price: '[PRICE]' },
      { id: 'massage', name: 'Therapeutic Massage', dur: '60 or 90 min', cat: 'massage', price: '[PRICE]' },
      { id: 'acu', name: 'Acupuncture', dur: '40 min', cat: 'acu', price: '[PRICE]' },

      { id: 'med', name: 'Guided Meditation', dur: '30 min', cat: 'med', price: '[PRICE]' },
      { id: 'counsel', name: 'Counselling', dur: '50 min', cat: 'counsel', price: '[PRICE]' },
      { id: 'nutri', name: 'Nutrition Coaching', dur: '45 min', cat: 'nutri', price: '[PRICE]' }
    ];
    var PROS = [
      { id: 'any', name: 'First available', role: 'Fastest option', ini: '★', tone: '#D4EE6F', does: ['*'] },
      { id: 'meera', name: 'Dr. Meera Iyer', role: 'Physiotherapist', ini: 'MI', tone: '#E6EFC2', does: ['physio', 'call'] },
      { id: 'lena', name: 'Lena Fischer', role: 'Massage therapist', ini: 'LF', tone: '#DCE7D6', does: ['massage', 'call'] },
      { id: 'wei', name: 'Wei Chen', role: 'Acupuncturist', ini: 'WC', tone: '#C7DDD3', does: ['acu', 'call'] },
      { id: 'arjun', name: 'Arjun Rao', role: 'Yoga & breathwork', ini: 'AR', tone: '#E6EFC2', does: ['yoga', 'med', 'call'] },
      { id: 'sofia', name: 'Sofia Alvarez', role: 'Pilates instructor', ini: 'SA', tone: '#DCE7D6', does: ['pilates', 'call'] },
      { id: 'kabir', name: 'Dr. Kabir Shah', role: 'Counsellor', ini: 'KS', tone: '#C7DDD3', does: ['counsel', 'call'] },
      { id: 'amara', name: 'Amara Okafor', role: 'Nutrition coach', ini: 'AO', tone: '#E6EFC2', does: ['nutri', 'call'] },
      { id: 'noor', name: 'Noor Haddad', role: 'Meditation guide', ini: 'NH', tone: '#DCE7D6', does: ['med', 'call'] }
    ];
    var step = s.step || 1;
    var svc = s.svc || null, pro = s.pro || null, day = s.day == null ? null : s.day, time = s.time || null, mode = s.mode || 'studio';
    var name = s.name || '', email = s.email || '', phone = s.phone || '', note = s.note || '';
    var svcObj = SV.filter(function (x) { return x.id === svc; })[0];
    var proList = PROS.filter(function (p) { return p.does[0] === '*' || (svc && p.does.indexOf(svc) >= 0); });
    var proObj = PROS.filter(function (p) { return p.id === pro; })[0];

    if (!this._base) { var b = new Date(); b.setHours(0, 0, 0, 0); this._base = b; }
    var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var dates = [];
    for (var i = 0; i < 7; i++) { var d = new Date(this._base.getTime()); d.setDate(d.getDate() + i + 1); dates.push(d); }
    var TIMES = ['08:30', '10:00', '11:30', '13:00', '14:30', '16:00', '17:30', '19:00'];
    var seed = (day == null ? 0 : day * 7) + (svc ? svc.length * 3 : 0) + (pro ? pro.length : 0);

    var ok1 = !!svcObj, ok2 = !!proObj, ok3 = day != null && !!time;
    var ok4 = name.trim() && /.+@.+\..+/.test(email);
    var oks = [ok1, ok2, ok3, ok4];
    var LABELS = ['Service', 'Practitioner', 'Date & time', 'Your details'];
    var steps = LABELS.map(function (l, i) {
      var n = i + 1;
      var reachable = oks.slice(0, i).every(function (x) { return x; });
      return { label: l, cls: n === step ? 'cur' : (n < step ? 'done' : ''), locked: !reachable, go: function () { if (reachable) self.setState({ step: n }); } };
    });
    function set(o) { return function () { self.setState(o); }; }
    var dObj = day == null ? null : dates[day];
    return {
      notBooked: !s.booked, booked: !!s.booked,
      steps: steps,
      s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4,
      svcs: SV.map(function (x, i) { return { name: x.name, dur: x.dur, delay: (i * 0.04) + 's', cls: x.id === svc ? 'on' : '', pick: set({ svc: x.id, pro: null, time: null }) }; }),
      pros: proList.map(function (p, i) { return { name: p.name, role: p.role, ini: p.ini, tone: p.tone, delay: (i * 0.06) + 's', cls: p.id === pro ? 'on' : '', pick: set({ pro: p.id, time: null }) }; }),
      days: dates.map(function (d, i) { return { wd: WD[d.getDay()], dd: d.getDate(), mo: MO[d.getMonth()], cls: i === day ? 'on' : '', pick: set({ day: i, time: null }) }; }),
      hasDay: day != null,
      times: TIMES.map(function (t, i) { var off = ((seed + i * 5) % 7 === 0) || ((seed * 3 + i) % 11 === 0); return { t: t, off: off, delay: (i * 0.03) + 's', cls: t === time ? 'on' : '', pick: set({ time: t }) }; }),
      studioCls: mode === 'studio' ? 'on' : '', onlineCls: mode === 'online' ? 'on' : '', homeCls: mode === 'home' ? 'on' : '',
      setStudio: set({ mode: 'studio' }), setOnline: set({ mode: 'online' }), setHome: set({ mode: 'home' }),
      name: name, email: email, phone: phone, note: note,
      onName: function (e) { self.setState({ name: e.target.value }); },
      onEmail: function (e) { self.setState({ email: e.target.value }); },
      onPhone: function (e) { self.setState({ phone: e.target.value }); },
      onNote: function (e) { self.setState({ note: e.target.value }); },
      no1: !ok1, no2: !ok2, no3: !ok3, no4: !ok4,
      next: function () { self.setState({ step: Math.min(4, step + 1) }); },
      prev: function () { self.setState({ step: Math.max(1, step - 1) }); },
      confirm: function () { if (ok4) self.setState({ booked: true }); },
      reset: set({ booked: false, step: 1, svc: null, pro: null, day: null, time: null }),
      sumSvc: svcObj ? svcObj.name : '—',
      sumPro: proObj ? proObj.name : '—',
      sumMode: mode === 'studio' ? 'In studio' : mode === 'online' ? 'Online' : 'Home visit',
      sumDate: dObj ? (WD[dObj.getDay()] + ', ' + dObj.getDate() + ' ' + MO[dObj.getMonth()]) : '—',
      sumTime: time || '—',
      sumPrice: svcObj ? svcObj.price : '—',
      firstName: name.trim().split(' ')[0]
    };
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
