<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stillwater — Practitioners</title>
<meta name="description" content="Stillwater Wellness Studio — physiotherapy, massage, yoga, counselling and nutrition under one roof.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F1}
html{scroll-behavior:smooth}
a{color:#1D4A3E}a:hover{color:#13221D}
.sw{--bg:#F4F6F1;--ink:#13221D;--muted:#4A5A54;--green:#1D4A3E;--green2:#2C6B58;--lime:#D4EE6F;--sand:#E7EDE2;--line:#D3DBD0;--ease:cubic-bezier(.16,1,.3,1);font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip}
.sw *{box-sizing:border-box}
.h{font-family:'Bricolage Grotesque',Manrope,sans-serif;letter-spacing:-0.02em}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:0;font:600 15px/1 Manrope,sans-serif;cursor:pointer;text-decoration:none;position:relative;overflow:hidden;transition:transform .4s var(--ease),background .3s,color .3s,box-shadow .4s}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--green);color:#fff}.btn-dark:hover{color:#fff;background:#163a31;box-shadow:0 14px 30px -12px rgba(29,74,62,.6)}
.btn-lime{background:var(--lime);color:var(--ink)}.btn-lime:hover{color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn-ghost:hover{background:var(--ink);color:#fff}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s}
.btn:hover::after{transform:translateX(120%)}
.btn .arr{transition:transform .35s}.btn:hover .arr{transform:translateX(4px)}
.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none}
.prog i{display:block;height:100%;background:var(--green2);transform-origin:left;transform:scaleX(0)}
.nav{position:sticky;top:0;z-index:50;background:rgba(244,246,241,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .4s,box-shadow .4s}
.nav.scrolled{border-color:rgba(211,219,208,.9);box-shadow:0 10px 30px -24px rgba(19,34,29,.4)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:80px;transition:height .4s var(--ease)}
.nav.scrolled .nav-in{height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 21px/1 'Bricolage Grotesque',sans-serif}
.logo:hover{color:var(--ink)}
.logo svg{transition:transform .8s var(--ease)}.logo:hover svg{transform:rotate(180deg)}
.links{display:flex;gap:32px}
.links a{color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;position:relative;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);transform:scaleX(0);transform-origin:right;transition:transform .4s}
.links a:hover::after,.links a.on::after{transform:scaleX(1);transform-origin:left}
.links a.on{font-weight:700}
.burger{display:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;align-items:center;justify-content:center;color:var(--ink)}
.mnav{display:none}
@media (max-width:900px){.links,.nav-cta{display:none}.burger{display:inline-flex}.mnav{display:flex;flex-direction:column;padding:8px 24px 24px;animation:drop .4s var(--ease)}.mnav a{padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:17px}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.sec{padding:130px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green2);margin:0 0 14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:2px;background:currentColor}
.h2{font-size:clamp(36px,4.6vw,62px);line-height:1.02;margin:0;font-weight:700;max-width:760px}
.sub{color:var(--muted);font-size:18px;line-height:1.65;margin:0}
.media{position:relative;overflow:hidden;border-radius:28px;background:#DCE4D7}
.px{position:absolute;inset:0;transform:scale(1.15);will-change:transform}
.px img,.media>img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#DCE4D7 0 18px,#D3DDCE 18px 36px)}
.ph span{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.85);font-size:13px;font-weight:700;color:var(--green)}
.ready .rv{opacity:0;transform:translateY(70px);transition:opacity 1.2s var(--ease),transform 1.5s var(--ease),clip-path 1.6s var(--ease);transition-delay:var(--d,0s)}
.ready .rv.rv-s{transform:scale(.9)}
.ready .media.rv{transform:none;clip-path:inset(30% 0 0 0 round 28px)}
.ready .media.rv .px img,.ready .media.rv .px .ph{transform:scale(1.25);transition:transform 2s var(--ease)}
.ready .rv.in{opacity:1;transform:none}
.ready .media.rv.in{clip-path:inset(0 0 0 0 round 28px)}
.ready .media.rv.in .px img,.ready .media.rv.in .px .ph{transform:none}
.lines .ln{display:block;overflow:hidden;padding-bottom:.06em}
.lines .ln>span{display:inline-block;animation:rise 1.1s var(--ease) both}
.lines .ln:nth-child(2)>span{animation-delay:.12s}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.fade{animation:fadeup 1s var(--ease) both}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.cta{background:var(--lime);border-radius:40px;padding:80px 48px;text-align:center;position:relative;overflow:hidden}
.cta h2{font-size:clamp(38px,5.4vw,72px);line-height:1;margin:0 auto 20px;max-width:880px;position:relative}
.cta p{font-size:18px;margin:0 auto 32px;max-width:520px;line-height:1.6;color:#2A3A34;position:relative}
.cta .c1{position:absolute;border-radius:50%;border:2px solid rgba(19,34,29,.15);width:340px;height:340px;left:-120px;top:-140px;animation:floaty 9s ease-in-out infinite}
.foot{padding:90px 0 40px}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:32px}
.foot h4{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 16px;color:var(--green2)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.foot li,.foot li a{color:var(--muted);text-decoration:none;font-size:15px}
.foot li a:hover{color:var(--ink)}
.foot-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.giant{font:700 clamp(64px,15vw,220px)/.85 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;color:var(--green);margin-top:56px;white-space:nowrap;overflow:hidden}
/* team */
.phead{padding:72px 0 40px}
.phead h1{font-size:clamp(48px,7vw,104px);line-height:.95;margin:18px 0 28px;font-weight:700}
.phead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:999px;flex-wrap:wrap;width:max-content;max-width:100%;margin-top:40px}
.tab{min-height:44px;padding:0 20px;border-radius:999px;border:0;background:transparent;font:600 14px Manrope,sans-serif;color:var(--muted);cursor:pointer;transition:all .3s}
.tab.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px;padding:48px 0 40px}
.card{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);animation:fadeup .7s var(--ease) both}
.card .media{height:460px;transition:border-radius .7s var(--ease)}
.card:hover .media{border-radius:200px 200px 28px 28px}
.card .ov{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);font-weight:700;font-size:14px;transform:translateY(130%);transition:transform .6s var(--ease)}
.card:hover .ov,.card:focus-visible .ov{transform:none}
.card h3{margin:18px 0 4px;font-size:24px}
.card .role{color:var(--green2);font-weight:600;font-size:15px;margin:0 0 6px}
.card .langs{color:var(--muted);font-size:14px;margin:0}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(19,34,29,.5);backdrop-filter:blur(4px);display:flex;justify-content:flex-end;animation:fadein .4s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.drawer{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:28px;animation:slidein .6s var(--ease) both;position:relative}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
.close{position:absolute;top:20px;right:20px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;cursor:pointer;display:grid;place-items:center;z-index:2;color:var(--ink);box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
.drawer .media{height:360px;margin-bottom:24px}
.drawer h2{font-size:38px;margin:0 0 6px;line-height:1.05}
.drawer dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin:24px 0;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.drawer dt{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.drawer dd{margin:0;font-weight:600;line-height:1.45}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.val{background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px}
.val .ic{width:52px;height:52px;border-radius:16px;background:var(--lime);display:grid;place-items:center;margin-bottom:20px}
.val h3{margin:0 0 8px;font-size:21px}.val p{margin:0;color:var(--muted);line-height:1.6}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.vals{grid-template-columns:minmax(0,1fr)}.sec{padding:90px 0}.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid,.foot-grid{grid-template-columns:minmax(0,1fr)}.card .media{height:380px}.cta{padding:56px 24px}.card .ov{transform:none}}
@media (prefers-reduced-motion:reduce){.sw *,.sw *::before,.sw *::after{animation:none!important;transition:none!important}.ready .rv{opacity:1!important;transform:none!important;clip-path:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-template">
<div class="sw {{ rootCls }}">
<div class="prog" aria-hidden="true"><i data-prog="1"></i></div>
<header class="nav {{ navCls }}">
<div class="wrap nav-in">
<a class="logo" href="index.html" aria-label="Stillwater home"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1D4A3E"></circle><path d="M8 19c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round"></path><path d="M8 13c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"></path></svg>Stillwater</a>
<nav class="links" aria-label="Main">
<a href="index.html">Home</a>
<a href="services.html">Services</a>
<a href="team.html" class="on" aria-current="page">Practitioners</a>
<a href="about.html">About</a>
</nav>
<a class="btn btn-dark nav-cta" href="book.html">Book a visit <span class="arr">→</span></a>
<button class="burger" aria-label="Menu" aria-expanded="{{ menuAria }}" onClick="{{ toggleMenu }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
</div>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<nav class="mnav" aria-label="Mobile">
<a href="index.html">Home</a><a href="services.html">Services</a><a href="team.html">Practitioners</a><a href="about.html">About</a><a href="book.html">Book a visit</a>
</nav>
</sc-if>
</header>

<section class="phead">
<div class="wrap">
<p class="kicker fade">Practitioners</p>
<div class="phead-row">
<h1 class="h lines"><span class="ln"><span>The people</span></span><span class="ln"><span>behind your care.</span></span></h1>
<p class="sub fade" style="max-width: 420px; animation-delay: .3s">Licensed specialists who meet every week to review shared plans, so your physio knows what your nutritionist recommended.</p>
</div>
<div class="tabs" role="tablist" aria-label="Filter by specialty">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="4"><button class="tab {{ c.cls }}" role="tab" aria-selected="{{ c.sel }}" onClick="{{ c.pick }}">{{ c.label }}</button></sc-for>
</div>
<div class="grid">
<sc-for list="{{ shown }}" as="p" hint-placeholder-count="6">
<button class="card" onClick="{{ p.open }}" style="animation-delay: {{ p.delay }}" aria-label="View profile of {{ p.name }}">
<div class="media"><div class="px" data-px=".08"><img src="{{ p.img }}" alt="Portrait of {{ p.name }}" loading="lazy"></div><span class="ov">View profile<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span></div>
<h3 class="h">{{ p.name }}</h3>
<p class="role">{{ p.role }}</p>
<p class="langs">{{ p.langs }}</p>
</button>
</sc-for>
</div>
</div>
</section>

<section class="sec" style="padding-top: 60px">
<div class="wrap">
<div class="sec-head"><div class="rv"><p class="kicker">How we work</p><h2 class="h h2">One team, one plan, around you.</h2></div></div>
<div class="vals">
<div class="val rv"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#13221D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5"></path></svg></span><h3 class="h">Weekly case reviews</h3><p>Practitioners meet every week to talk through shared plans.</p></div>
<div class="val rv" style="--d: .12s"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#13221D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"></path><path d="M9 12l2 2 4-4"></path></svg></span><h3 class="h">Licensed and insured</h3><p>Every practitioner holds a current licence in their field. [ADD REGISTRATION DETAILS]</p></div>
<div class="val rv" style="--d: .24s"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#13221D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"></path></svg></span><h3 class="h">Always learning</h3><p>Ongoing training keeps our methods current and evidence-based.</p></div>
</div>
</div>
</section>

<section class="wrap">
<div class="cta rv rv-s"><span class="c1" aria-hidden="true"></span>
<h2 class="h">Found the right person?</h2>
<p>Book directly with any practitioner, or let us match you.</p>
<a class="btn btn-dark" href="book.html" style="position: relative">Book a visit <span class="arr">→</span></a>
</div>
</section>

<footer class="foot">
<div class="wrap">
<div class="foot-grid">
<div><a class="logo" href="index.html"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#1D4A3E"></circle><path d="M8 19c3-3 6-3 9 0s6 3 9 0" stroke="#D4EE6F" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg>Stillwater</a><p style="color: #4A5A54; line-height: 1.6; max-width: 320px; margin: 16px 0 0">A healthcare and wellness studio for body and mind.</p></div>
<div><h4>Explore</h4><ul><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li><a href="about.html">About</a></li><li><a href="book.html">Book a visit</a></li></ul></div>
<div><h4>Services</h4><ul><li><a href="services.html">Physiotherapy</a></li><li><a href="services.html">Massage</a></li><li><a href="services.html">Yoga &amp; Pilates</a></li><li><a href="services.html">Counselling</a></li></ul></div>
<div><h4>Visit</h4><ul><li>[STUDIO ADDRESS]</li><li>[OPENING HOURS]</li><li>[PHONE]</li><li>[EMAIL]</li></ul></div>
</div>
<div class="giant" aria-hidden="true">stillwater</div>
<div class="foot-bot"><span>© 2026 Stillwater Wellness Studio · Photography via Unsplash</span><span>Not for emergencies — call your local emergency number.</span></div>
</div>
</footer>

<sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
<div class="scrim" onClick="{{ close }}">
<aside class="drawer" role="dialog" aria-modal="true" aria-label="{{ sel.name }}" onClick="{{ stop }}">
<button class="close" aria-label="Close profile" onClick="{{ close }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div class="media"><img src="{{ sel.img }}" alt="Portrait of {{ sel.name }}"></div>
<p class="kicker">{{ sel.role }}</p>
<h2 class="h">{{ sel.name }}</h2>
<p class="sub" style="font-size: 17px; margin-top: 14px">{{ sel.bio }}</p>
<dl>
<div><dt>Training</dt><dd>{{ sel.training }}</dd></div>
<div><dt>Languages</dt><dd>{{ sel.langs }}</dd></div>
<div><dt>Focus areas</dt><dd>{{ sel.focus }}</dd></div>
<div><dt>Sees clients</dt><dd>{{ sel.days }}</dd></div>
</dl>
<a class="btn btn-dark" href="book.html" style="width: 100%">Book with {{ sel.first }} <span class="arr">→</span></a>
</aside>
</div>
</sc-if>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4200}}'>
